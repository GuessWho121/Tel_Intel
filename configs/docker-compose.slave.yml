x-minioconf: &minioconf
  image: minio/minio:RELEASE.2025-07-23T15-54-02Z
  command: server /data --console-address ":9001"
  environment:
    - MINIO_ROOT_USER=admin
    - MINIO_ROOT_PASSWORD=pass1234

x-sparkworker: &sparkworker
  image: airtel-spark:4.1.2-lakehouse
  command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://100.71.201.92:7077 --cores 1 --memory 1536m --webui-port 8081 #Change Master IP
  
services:
  minio1:
    <<: *minioconf
    ports:
      - 9000:9000
      - 9001:9001
    hostname: s3_1
    container_name: s3_1
    volumes:
      - s31:/data

  worker1:
    <<: *sparkworker
    hostname: worker1
    container_name: worker1
    ports:
      - 8081:8081
  
  worker2:
    <<: *sparkworker
    hostname: worker2
    container_name: worker2
    ports:
      - 8082:8081

  worker3:
    <<: *sparkworker
    hostname: worker3
    container_name: worker3
    ports:
      - 8083:8081

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass1234
      POSTGRES_DB: metastore
    ports:
      - 5432:5432
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data

  hive:
    image: apache/hive:4.0.0
    container_name: hive
    hostname: hive
    environment:
      - DB_DRIVER=postgres
      - SERVICE_NAME=metastore
      - SERVICE_OPTS >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - 9083:9083
    depends_on:
      - postgres

volumes:
  s31:
  hive_metastore_db:
